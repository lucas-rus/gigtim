<script>
        // Simple JS to handle the radio button visual state matching the custom styling
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.role-card-input');
            
            function updateRadioState() {
                inputs.forEach(input => {
                    const innerCircle = input.nextElementSibling.querySelector('.w-2\\.5');
                    if(innerCircle) {
                        if(input.checked) {
                            innerCircle.classList.remove('hidden');
                            input.nextElementSibling.querySelector('.w-5').classList.add('opacity-100');
                        } else {
                            innerCircle.classList.add('hidden');
                        }
                    }
                });
            }

            inputs.forEach(input => {
                input.addEventListener('change', updateRadioState);
            });
            
            // Initialize
            updateRadioState();
        });
    </script>
