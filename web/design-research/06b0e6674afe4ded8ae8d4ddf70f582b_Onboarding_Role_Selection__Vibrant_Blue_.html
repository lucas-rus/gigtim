<!DOCTYPE html>

<html class="dark" lang="ro"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GigTim - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#002b7f",
                        "surface-tint": "#b5c4ff",
                        "surface-dim": "#131315",
                        "surface-container-high": "#2a2a2c",
                        "on-primary": "#00297a",
                        "on-error": "#690005",
                        "inverse-on-surface": "#313032",
                        "outline": "#8e909d",
                        "indigo-glow": "#6366f1",
                        "slate-accents": "#1e293b",
                        "on-primary-fixed-variant": "#224194",
                        "error": "#ffb4ab",
                        "primary-fixed-dim": "#b5c4ff",
                        "surface-container": "#201f21",
                        "on-tertiary-container": "#918eff",
                        "on-tertiary": "#1d00a5",
                        "on-secondary": "#233144",
                        "on-surface-variant": "#c4c6d3",
                        "surface-container-lowest": "#0e0e10",
                        "tertiary-fixed-dim": "#c3c0ff",
                        "on-background": "#e5e1e4",
                        "on-secondary-container": "#abb9d2",
                        "surface": "#131315",
                        "success-emerald": "#10b981",
                        "inverse-surface": "#e5e1e4",
                        "secondary-fixed-dim": "#b9c7e0",
                        "on-tertiary-fixed": "#0f0069",
                        "tertiary": "#c3c0ff",
                        "on-secondary-fixed-variant": "#3a485c",
                        "employer-action": "#8b5cf6",
                        "on-secondary-fixed": "#0d1c2f",
                        "surface-container-highest": "#353437",
                        "inverse-primary": "#3d5aad",
                        "surface-variant": "#353437",
                        "primary": "#b5c4ff",
                        "surface-container-low": "#1c1b1d",
                        "on-tertiary-fixed-variant": "#3323cc",
                        "secondary-fixed": "#d5e3fd",
                        "tertiary-fixed": "#e2dfff",
                        "on-primary-container": "#7c97ef",
                        "danger-crimson": "#ef4444",
                        "on-error-container": "#ffdad6",
                        "primary-fixed": "#dbe1ff",
                        "surface-bright": "#39393b",
                        "secondary-container": "#3c4a5e",
                        "on-primary-fixed": "#00174c",
                        "worker-info": "#3b82f6",
                        "on-surface": "#e5e1e4",
                        "background": "#131315",
                        "outline-variant": "#444651",
                        "tertiary-container": "#1f00ac",
                        "error-container": "#93000a",
                        "secondary": "#b9c7e0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "card-padding": "24px",
                        "section-gap-mobile": "96px",
                        "base": "4px",
                        "stack-gap-sm": "8px",
                        "stack-gap-md": "16px",
                        "section-gap-desktop": "128px",
                        "stack-gap-lg": "24px",
                        "container-max": "1152px",
                        "input-height": "40px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "button-text": ["Inter"],
                        "display-hero": ["Outfit"],
                        "headline-md": ["Outfit"],
                        "headline-lg": ["Outfit"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-hero-mobile": ["Outfit"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "button-text": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "display-hero": ["56px", { "lineHeight": "64px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-hero-mobile": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            min-height: max(884px, 100dvh);
        }
        .bg-gradient-radial {
            background-image: radial-gradient(circle, var(--tw-gradient-stops));
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center relative overflow-x-hidden selection:bg-primary selection:text-on-primary">
<!-- Ambient Lighting (Sleek Depth) -->
<div class="fixed inset-0 z-[-10] bg-surface-container-lowest overflow-hidden pointer-events-none">
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[600px] bg-primary-container/20 rounded-full blur-[140px] opacity-60"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-indigo-glow/5 blur-[160px]"></div>
</div>
<!-- Main Container -->
<main class="w-full max-w-container-max mx-auto px-card-padding py-section-gap-mobile md:py-section-gap-desktop flex flex-col items-center justify-center flex-grow z-10 relative">
<!-- Header Section -->
<div class="text-center mb-stack-gap-lg md:mb-12 max-w-2xl w-full">
<h1 class="font-display-hero-mobile text-display-hero-mobile md:font-display-hero md:text-display-hero text-on-surface mb-stack-gap-md tracking-tight">
                Cum vrei să folosești GigTim?
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xl mx-auto">
                Selectează modul în care dorești să interacționezi cu platforma. Această opțiune ne va ajuta să-ți personalizăm experiența.
            </p>
</div>
<!-- Selection Cards (Cleaner Design) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-gap-lg w-full max-w-4xl mb-stack-gap-lg md:mb-12">
<!-- Worker Card -->
<label class="relative group cursor-pointer h-full">
<input class="peer sr-only" name="user_role" type="radio" value="worker"/>
<div class="h-full bg-surface-container-low border-2 border-transparent rounded-2xl p-8 flex flex-col items-center text-center transition-all duration-300 hover:bg-surface-container hover:shadow-lg peer-checked:border-worker-info peer-checked:bg-worker-info/10 peer-checked:shadow-[0_8px_30px_rgba(59,130,246,0.15)]">
<div class="w-20 h-20 rounded-full bg-surface-container-high flex items-center justify-center mb-6 transition-all duration-300 group-hover:scale-105 peer-checked:bg-worker-info peer-checked:text-white">
<span class="material-symbols-outlined text-[40px] text-on-surface-variant transition-colors duration-300 peer-checked:text-white" style="font-variation-settings: 'FILL' 1;">
                            engineering
                        </span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-4 transition-colors duration-300 peer-checked:text-worker-info">
                        Vreau să lucrez
                    </h2>
<p class="font-body-md text-body-md text-on-surface-variant flex-grow leading-relaxed">
                        Găsește oportunități rapide, aplică la joburi și gestionează-ți veniturile cu ușurință. Ideal pentru profesioniști independenți și zilieri.
                    </p>
<!-- Selection Indicator -->
<div class="absolute top-6 right-6 w-6 h-6 rounded-full border-2 border-outline-variant transition-colors duration-300 peer-checked:border-worker-info peer-checked:bg-worker-info flex items-center justify-center opacity-0 peer-checked:opacity-100">
<span class="material-symbols-outlined text-[16px] text-white font-bold">check</span>
</div>
</div>
</label>
<!-- Employer Card -->
<label class="relative group cursor-pointer h-full">
<input class="peer sr-only" name="user_role" type="radio" value="employer"/>
<div class="h-full bg-surface-container-low border-2 border-transparent rounded-2xl p-8 flex flex-col items-center text-center transition-all duration-300 hover:bg-surface-container hover:shadow-lg peer-checked:border-employer-action peer-checked:bg-employer-action/10 peer-checked:shadow-[0_8px_30px_rgba(139,92,246,0.15)]">
<div class="w-20 h-20 rounded-full bg-surface-container-high flex items-center justify-center mb-6 transition-all duration-300 group-hover:scale-105 peer-checked:bg-employer-action peer-checked:text-white">
<span class="material-symbols-outlined text-[40px] text-on-surface-variant transition-colors duration-300 peer-checked:text-white" style="font-variation-settings: 'FILL' 1;">
                            business_center
                        </span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-4 transition-colors duration-300 peer-checked:text-employer-action">
                        Vreau să angajez
                    </h2>
<p class="font-body-md text-body-md text-on-surface-variant flex-grow leading-relaxed">
                        Publică oferte, găsește forță de muncă calificată și gestionează plățile și contractele într-un mediu sigur și legal.
                    </p>
<!-- Selection Indicator -->
<div class="absolute top-6 right-6 w-6 h-6 rounded-full border-2 border-outline-variant transition-colors duration-300 peer-checked:border-employer-action peer-checked:bg-employer-action flex items-center justify-center opacity-0 peer-checked:opacity-100">
<span class="material-symbols-outlined text-[16px] text-white font-bold">check</span>
</div>
</div>
</label>
</div>
<!-- Action Section -->
<div class="w-full max-w-md flex justify-center">
<button class="w-full bg-worker-info text-white rounded-xl py-4 px-8 font-button-text text-button-text shadow-lg hover:bg-blue-600 hover:shadow-worker-info/30 transform hover:-translate-y-0.5 transition-all duration-300 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:bg-surface-container-high disabled:hover:shadow-none disabled:text-on-surface-variant" disabled="" id="continueBtn">
                Continuă
            </button>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const radioButtons = document.querySelectorAll('input[name="user_role"]');
            const continueBtn = document.getElementById('continueBtn');

            radioButtons.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    continueBtn.disabled = false;
                    
                    // Adapt button color based on selection for extra polish
                    if(e.target.value === 'worker') {
                        continueBtn.className = "w-full bg-worker-info text-white rounded-xl py-4 px-8 font-button-text text-button-text shadow-lg hover:bg-blue-600 hover:shadow-worker-info/30 transform hover:-translate-y-0.5 transition-all duration-300";
                    } else {
                        continueBtn.className = "w-full bg-employer-action text-white rounded-xl py-4 px-8 font-button-text text-button-text shadow-lg hover:bg-purple-600 hover:shadow-employer-action/30 transform hover:-translate-y-0.5 transition-all duration-300";
                    }
                });
            });
        });
    </script>
</body></html>
