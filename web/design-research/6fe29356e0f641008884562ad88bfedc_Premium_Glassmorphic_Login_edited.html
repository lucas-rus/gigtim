<!DOCTYPE html>

<html class="dark" lang="ro"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>GigTim — Marketplace de Zilieri</title>
<meta content="Platformă de gig-economy pentru piața HoReCa din România. Conectăm lucrătorii zilieri cu afacerile locale." name="description"/>
<meta content="zilieri,HoReCa,România,gig economy,muncă temporară" name="keywords"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          background: '#0a0a0c',
          primary: {
            DEFAULT: '#4f46e5',
            foreground: '#ffffff',
          },
        },
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
          heading: ['Outfit', 'sans-serif'],
        }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Outfit:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
</head>
<body class="min-h-screen bg-background font-sans antialiased text-white selection:bg-indigo-500/30">
<div class="relative flex min-h-screen items-center justify-center overflow-hidden p-4">
<!-- Background Glows -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[10%] left-[15%] h-[350px] w-[350px] rounded-full bg-indigo-600/10 blur-[120px] animate-pulse"></div>
<div class="absolute bottom-[15%] right-[10%] h-[400px] w-[400px] rounded-full bg-blue-600/10 blur-[150px]"></div>
</div>
<div class="w-full max-w-md space-y-8 relative z-10">
<!-- Branding -->
<div class="text-center space-y-3">
<div class="inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-indigo-700 text-white text-3xl font-bold shadow-lg shadow-indigo-500/20">G</div>
<h1 class="text-4xl font-extrabold tracking-tight font-heading bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">GigTim</h1>
<p class="text-sm text-slate-400 font-light tracking-wide">Marketplace de zilieri pentru România</p>
</div>
<!-- Glassmorphic Card -->
<div class="flex flex-col overflow-hidden rounded-2xl border border-white/5 bg-white/5 backdrop-blur-xl shadow-2xl shadow-black/50">
<div class="px-8 pt-8 pb-6 text-center border-b border-white/5">
<h2 class="text-2xl font-bold font-heading text-white tracking-tight">Autentificare</h2>
<p class="mt-2 text-sm text-slate-400 font-light">Intră în contul tău pentru a continua</p>
</div>
<form action="#" class="flex flex-col">
<div class="px-8 py-8 space-y-6">
<div class="space-y-2">
<label class="block text-xs font-semibold uppercase tracking-wider text-slate-400" for="email">Email</label>
<input autocomplete="email" class="h-11 w-full bg-black/30 border border-white/10 rounded-xl px-4 py-2 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500/50 transition-all duration-300" id="email" name="email" placeholder="exemplu@email.com" required="" type="email"/>
</div>
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="block text-xs font-semibold uppercase tracking-wider text-slate-400" for="password">Parolă</label>
<a class="text-xs font-medium text-indigo-400 hover:text-indigo-300 transition-colors" href="/forgot-password">Ai uitat parola?</a>
</div>
<input autocomplete="current-password" class="h-11 w-full bg-black/30 border border-white/10 rounded-xl px-4 py-2 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500/50 transition-all duration-300" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="px-8 pb-8 pt-4 bg-black/20 flex flex-col gap-6">
<button class="inline-flex w-full h-12 items-center justify-center rounded-xl bg-gradient-to-r from-indigo-500 to-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-indigo-500/25 hover:from-indigo-400 hover:to-indigo-500 hover:shadow-indigo-500/40 transition-all duration-300 hover:-translate-y-0.5 active:translate-y-0 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-background" type="submit">
            Conectare
          </button>
<p class="text-center text-sm text-slate-400 font-light">
            Nu ai cont? 
            <a class="font-medium text-indigo-400 hover:text-indigo-300 transition-colors" href="/register">Înregistrează-te</a>
</p>
</div>
</form>
</div>
</div>
</div>
</body></html>
