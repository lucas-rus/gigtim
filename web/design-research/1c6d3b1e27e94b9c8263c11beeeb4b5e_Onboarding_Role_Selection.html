<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-container-padding-mobile md:p-container-padding-desktop">
<div class="w-full max-w-md mx-auto space-y-stack-lg flex flex-col items-center">
<!-- Brand / Header -->
<div class="text-center space-y-stack-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">Zilier</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Alege cum vrei să folosești aplicația pentru a-ți personaliza experiența.</p>
</div>
<!-- Role Selection Cards -->
<div class="w-full space-y-gutter">
<!-- Worker Card -->
<button class="w-full bg-surface-container-lowest p-stack-lg rounded-xl shadow-[0px_2px_8px_0px_rgba(0,0,0,0.04)] hover:shadow-[0px_8px_16px_0px_rgba(0,0,0,0.08)] border-2 border-transparent hover:border-primary-container transition-all duration-300 flex flex-col items-center text-center group active:scale-95 text-left focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2">
<div class="w-16 h-16 bg-primary-fixed rounded-full flex items-center justify-center mb-stack-md group-hover:bg-primary-container group-hover:text-on-primary transition-colors duration-300 text-primary-container">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">engineering</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-stack-sm">Caut de lucru</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Găsește joburi de zi în zona ta și aplică rapid.</p>
</button>
<!-- Employer Card -->
<button class="w-full bg-surface-container-lowest p-stack-lg rounded-xl shadow-[0px_2px_8px_0px_rgba(0,0,0,0.04)] hover:shadow-[0px_8px_16px_0px_rgba(0,0,0,0.08)] border-2 border-transparent hover:border-primary-container transition-all duration-300 flex flex-col items-center text-center group active:scale-95 text-left focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2">
<div class="w-16 h-16 bg-primary-fixed rounded-full flex items-center justify-center mb-stack-md group-hover:bg-primary-container group-hover:text-on-primary transition-colors duration-300 text-primary-container">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">business_center</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-stack-sm">Vreau să angajez</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Postează oferte de muncă și găsește muncitori calificați rapid.</p>
</button>
</div>
<!-- Action Area (Disabled state until selection) -->
<div class="w-full pt-stack-md">
<button class="w-full bg-secondary-container text-on-secondary-fixed font-button-text text-button-text py-stack-md rounded-lg shadow-[0px_2px_8px_0px_rgba(0,0,0,0.04)] hover:shadow-[0px_8px_16px_0px_rgba(0,0,0,0.08)] active:scale-95 transition-all duration-200 opacity-50 cursor-not-allowed">
                Continuă
            </button>
</div>
</div>
<script>
        // Simple script to handle selection and enable the continue button
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('button.w-full.bg-surface-container-lowest');
            const continueBtn = document.querySelector('button.bg-secondary-container');

            cards.forEach(card => {
                card.addEventListener('click', () => {
                    // Reset all cards
                    cards.forEach(c => {
                        c.classList.remove('border-primary-container', 'shadow-[0px_8px_16px_0px_rgba(0,0,0,0.08)]');
                        c.classList.add('border-transparent');
                        const iconContainer = c.querySelector('div.rounded-full');
                        iconContainer.classList.remove('bg-primary-container', 'text-on-primary');
                        iconContainer.classList.add('bg-primary-fixed', 'text-primary-container');
                    });

                    // Set active state for clicked card
                    card.classList.add('border-primary-container', 'shadow-[0px_8px_16px_0px_rgba(0,0,0,0.08)]');
                    card.classList.remove('border-transparent');
                    const activeIcon = card.querySelector('div.rounded-full');
                    activeIcon.classList.remove('bg-primary-fixed', 'text-primary-container');
                    activeIcon.classList.add('bg-primary-container', 'text-on-primary');

                    // Enable continue button
                    continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    continueBtn.classList.add('hover:bg-secondary-fixed-dim');
                });
            });
        });
    </script>
</body></html>
