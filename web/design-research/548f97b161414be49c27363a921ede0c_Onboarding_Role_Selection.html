<!DOCTYPE html>

<html lang="ro"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Zilier - Selectare Rol</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#dadadc",
                        "error": "#ba1a1a",
                        "surface-variant": "#e2e2e5",
                        "secondary-fixed-dim": "#ecc300",
                        "on-primary-fixed-variant": "#224194",
                        "on-secondary-fixed-variant": "#554500",
                        "inverse-primary": "#b5c4ff",
                        "on-primary-container": "#7c97ef",
                        "inverse-on-surface": "#f0f0f3",
                        "on-surface-variant": "#444651",
                        "secondary-container": "#ffd31a",
                        "tertiary-fixed": "#7cf7df",
                        "primary-fixed-dim": "#b5c4ff",
                        "surface-container-highest": "#e2e2e5",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#20ad98",
                        "surface-bright": "#f9f9fc",
                        "tertiary-container": "#003a31",
                        "tertiary-fixed-dim": "#5ddac3",
                        "on-tertiary-fixed-variant": "#005045",
                        "background": "#f9f9fc",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f3f3f6",
                        "surface-container": "#eeeef0",
                        "on-secondary": "#ffffff",
                        "primary": "#001851",
                        "on-secondary-fixed": "#231b00",
                        "tertiary": "#00231d",
                        "surface": "#f9f9fc",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e8e8ea",
                        "outline-variant": "#c4c6d3",
                        "on-secondary-container": "#705b00",
                        "primary-fixed": "#dbe1ff",
                        "on-background": "#1a1c1e",
                        "on-primary-fixed": "#00174c",
                        "secondary-fixed": "#ffe17b",
                        "on-tertiary-fixed": "#00201b",
                        "surface-tint": "#3d5aad",
                        "on-surface": "#1a1c1e",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#2f3133",
                        "secondary": "#715c00",
                        "primary-container": "#002b7f",
                        "outline": "#747683"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "container-padding-mobile": "16px",
                        "gutter": "16px",
                        "stack-md": "12px",
                        "container-padding-desktop": "24px",
                        "stack-sm": "4px",
                        "stack-lg": "24px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Inter"],
                        "button-text": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "button-text": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],

        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-container-padding-mobile md:p-container-padding-desktop">
<div class="w-full max-w-md flex flex-col items-center text-center space-y-stack-lg">
<!-- Header Section -->
<div class="space-y-stack-sm flex flex-col items-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight">
                Zilier
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs">
                Conectăm munca cu oportunitatea.
            </p>
</div>
<!-- Role Selection Cards -->
<div class="w-full grid grid-cols-1 gap-gutter mt-stack-lg">
<!-- Worker Card -->
<button class="group relative w-full bg-surface-container-lowest rounded-xl p-6 shadow-[0px_2px_8px_0px_rgba(0,0,0,0.04)] hover:shadow-[0px_8px_16px_0px_rgba(0,0,0,0.08)] transition-all duration-300 border border-transparent hover:border-secondary-container flex flex-col items-center justify-center space-y-stack-md active:scale-95">
<div class="w-16 h-16 rounded-full bg-surface-container-low text-primary flex items-center justify-center group-hover:bg-secondary-container group-hover:text-on-secondary-container transition-colors duration-300">
<span class="material-symbols-outlined text-4xl" data-icon="construction">construction</span>
</div>
<div class="flex flex-col space-y-stack-sm">
<span class="font-headline-sm text-headline-sm text-on-surface">Caut de lucru</span>
<span class="font-body-md text-body-md text-on-surface-variant">Găsește joburi zilnice în zona ta.</span>
</div>
<!-- Selection Indicator -->
<div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<span class="material-symbols-outlined text-secondary-container" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Employer Card -->
<button class="group relative w-full bg-surface-container-lowest rounded-xl p-6 shadow-[0px_2px_8px_0px_rgba(0,0,0,0.04)] hover:shadow-[0px_8px_16px_0px_rgba(0,0,0,0.08)] transition-all duration-300 border border-transparent hover:border-primary-container flex flex-col items-center justify-center space-y-stack-md active:scale-95">
<div class="w-16 h-16 rounded-full bg-surface-container-low text-primary flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary transition-colors duration-300">
<span class="material-symbols-outlined text-4xl" data-icon="engineering">engineering</span>
</div>
<div class="flex flex-col space-y-stack-sm">
<span class="font-headline-sm text-headline-sm text-on-surface">Vreau să angajez</span>
<span class="font-body-md text-body-md text-on-surface-variant">Găsește forță de muncă rapid și simplu.</span>
</div>
<!-- Selection Indicator -->
<div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<span class="material-symbols-outlined text-primary-container" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
</div>
<!-- Footer / Support -->
<div class="mt-stack-lg pt-stack-md">
<p class="font-label-md text-label-md text-on-surface-variant opacity-70">
                Ai nevoie de ajutor? <a class="text-primary hover:underline font-button-text" href="#">Contactează-ne</a>
</p>
</div>
</div>
</body></html>
